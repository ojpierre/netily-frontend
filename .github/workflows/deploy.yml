name: Deploy Frontend to DigitalOcean VPS

on:
  push:
    branches:
      - prod-frontend

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy frontend to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 18m
          script: |
            echo "==> Pulling latest frontend code..."
            cd ~/netily_frontend
            git fetch origin prod-frontend
            git reset --hard origin/prod-frontend

            echo "==> Rebuilding frontend container (no cache)..."
            cd ~/netily_cloud/docker
            docker compose build --no-cache frontend

            echo "==> Restarting frontend container..."
            docker compose up -d --force-recreate frontend

            echo "==> Restarting nginx (re-resolve container IPs)..."
            docker compose restart nginx

            echo "==> Cleaning up old Docker images..."
            docker image prune -f

            echo "==> Frontend deployment complete!"